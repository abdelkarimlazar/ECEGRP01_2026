* {

body {

    background: #080d1a;

}

/* NAVIGATION */
header {
    width: 100%;
    padding: 22px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 27px;
    font-weight: 800;
}

nav {
    display: flex;
}

nav a {
    text-decoration: none;
    color: #cbd5e1;

}

/* HERO */
.hero {
    min-height: 100vh;
    align-items: center;
    justify-content: space-between;
    gap: 50px;
    background:
    radial-gradient(circle at 80% 40%, #2563eb30, transparent 35%);

    animation: flottement 4s infinite ease-in-out;
}
.hero-content {
    max-width: 650px;
    animation: apparition 1s ease;
    box-shadow: 0 0 80px #2563eb35;
}

.hero h1 {
    font-size: clamp(40px, 6vw, 70px);
    margin-bottom: 25px;
    font-size: 110px;
}

.cards {
    display: grid;
    gap: 25px;
}

.card {
    padding: 35px;
    background: #111a2e;
    border: 1px solid #ffffff12;
    border-radius: 18px;
    transition: .4s;
}

.card:hover {
    transform: translateY(-10px);
    border-color: #3b82f6;
    box-shadow: 0 15px 40px #2563eb20;
}

.card .icon {
    font-size: 40px;
    margin-bottom: 20px;
}

.card h3 {
    font-size: 22px;
    margin-bottom: 15px;
}

.card p {
    color: #94a3b8;
    line-height: 1.7;
}

/* À PROPOS */
.about {
    background: #0d1527;
    text-align: center;
}

.about p {
    max-width: 750px;
    margin: auto;
    color: #94a3b8;
    font-size: 17px;
    line-height: 1.9;
}

/* CONTACT */
.contact {
    text-align: center;
}

.contact p {
    color: #94a3b8;
    margin: 20px 0 30px;
}

/* FOOTER */
footer {
    padding: 30px;
    text-align: center;
    color: #64748b;
    border-top: 1px solid #ffffff12;
}

/* ANIMATIONS */
@keyframes flottement {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

@keyframes apparition {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MOBILE */
@media(max-width: 768px) {
    header {
        padding: 20px 5%;
        flex-direction: column;
        gap: 15px;
    }

    nav {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    nav a {
        font-size: 14px;
    }

    .hero {
        flex-direction: column;
        text-align: center;
        padding-top: 180px;
    }

    .hero-image {
        width: 250px;
        height: 250px;
        font-size: 80px;
    }
    grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
}
